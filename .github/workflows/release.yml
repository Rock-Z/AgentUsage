name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag version
        shell: bash
        run: |
          set -euo pipefail
          plist_version="$(sed -n '/CFBundleShortVersionString/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' Scripts/build-app.sh)"
          test "${GITHUB_REF_NAME#v}" = "$plist_version"

      - name: Build universal app
        shell: bash
        run: |
          set -euo pipefail
          swift build -c release --triple arm64-apple-macosx14.0 --scratch-path .build/arm64
          swift build -c release --triple x86_64-apple-macosx14.0 --scratch-path .build/x86_64
          mkdir -p .build/universal
          lipo -create \
            .build/arm64/arm64-apple-macosx/release/AgentUsage \
            .build/x86_64/x86_64-apple-macosx/release/AgentUsage \
            -output .build/universal/AgentUsage
          AGENTUSAGE_EXECUTABLE="$PWD/.build/universal/AgentUsage" ./Scripts/build-app.sh

      - name: Ad-hoc sign
        shell: bash
        run: |
          set -euo pipefail
          app=".build/release/AgentUsage.app"
          codesign --force --options runtime --sign - "$app/Contents/MacOS/AgentUsage"
          codesign --force --options runtime --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --keepParent .build/release/AgentUsage.app dist/AgentUsage-macos-universal.zip
          (
            cd dist
            shasum -a 256 AgentUsage-macos-universal.zip > AgentUsage-macos-universal.zip.sha256
          )
          cp Scripts/install.sh dist/install.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/AgentUsage-macos-universal.zip \
            dist/AgentUsage-macos-universal.zip.sha256 \
            dist/install.sh \
            --verify-tag \
            --generate-notes \
            --notes "> [!WARNING]
            > This build is ad-hoc signed, not Apple Developer ID-signed or notarized. macOS will require explicit approval before the first launch. See the README installation instructions." \
            --title "AgentUsage $GITHUB_REF_NAME"
